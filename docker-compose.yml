name: pixie-gallery
services:
  pixie-gallery:
    build: .
    image: pixie-gallery:latest
    container_name: pixie-gallery
    restart: unless-stopped
    working_dir: /code
    ports:
      - "8085:8000"
    volumes:
      # Кэш миниатюр, базы настроек (config_db.json, exif_cache.json) и перекодированные видео
      - /DATA/AppData/pixie-gallery/cache:/cache
      # Временные файлы
      - /DATA/AppData/pixie-gallery/tmp:/tmp
      # Основная библиотека фотографий
      - /DATA/Media/Photos:/photos:ro
      # Общий каталог медиа для подключения дополнительных библиотек в настройках (/media/...)
      - /DATA/Media:/media:ro
    environment:
      - PHOTOS_DIR=/photos
      - CACHE_DIR=/cache
      - TMPDIR=/tmp
      - GALLERY_TITLE=PORTFOLIO & ARCHIVE
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123
      - SECRET_KEY=my-local-nas-secret-key-2026
      - DEFAULT_EXCLUDE_EXTS=.cr2,.cr3,.nef,.arw,.dng,.orf,.rw2,.pef,.raf,.tif,.tiff,.psd,.xmp
      - DEFAULT_EXCLUDE_MASKS=*_small.*, *_smal.*, *_thumb.*, ._*
    x-casaos:
      author: self
      category: Gallery
      hostname: ""
      icon: https://raw.githubusercontent.com/henadzis/pixie-gallery/main/pixie_gallery.svg
      index: /
      port_map: "8085"
      scheme: http
      title:
        en_us: Pixie Gallery